<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Dateibrowser</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <div class="app" id="hidden">
        <!-- Login Form -->
        <div id="login-container">
            <h1>Login</h1>
            <form id="login-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Login</button>
            </form>
            <div id="error-message" style="color: red; display: none;"></div>
        </div>

        <!-- Main Application Content -->
        <header id='header' style="display: none;">
            <h4>HTML5 Dateibrowser</h4>
            <button id="upload_diraction">Datei hier hochladen</button>
            <button id="add_diraction">Verzeichnis hinzufügen</button>
            <button id="remove_diraction">Dieses Verzeichnis löschen</button>
            <button id="logout-button">Log Out</button>
        </header>
        <div id="main-content" style="display: none;">
            <div class="sidebar">
                <div id="browser">
                    <ul id="browser_dir_list">
                        <li>
                            <a href="#" class="browser_action" id="return">
                                <img src="./assets/icons/turn-left-arrow-icon.png" height="15px" width="15px"/>
                                <span>Zurück</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div id="currentDir"></div>
            </div>

            <!-- Add dir PopUp -->

            <div id="dir_popup" class="popups">
                <form id="add_dir_form">
                    <label for="dirname">Name:</label>
                    <input type="text" id="dirname" name="dirname" required>
                    <button type="submit">Hinzufügen</button>
                </form>
            </div>

            <div id="upload_popup" class="popups">
                <form id="upload_form">
                    <input type="file" id="upload_file" name="upload_file" required>
                    <button type="submit">Hinzufügen</button>
                </form>
            </div>

            <div id="viewer"></div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
